<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,onSnapshot,query,where,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const ADMIN_KEY="YN-CREATOR-2026"; // Creator Master Key (ต้องตรงกับ config/security.mk)

// ---------- helpers ----------
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fd=t=>new Date(t).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
const ft=t=>new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false}).replace('.',':');
function toast(m,t='ok'){const e=document.createElement('div');e.className='px-4 py-3 rounded-2xl shadow-lg text-white text-sm '+{ok:'bg-emerald-600',err:'bg-rose-600',warn:'bg-amber-600'}[t];e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3500)}
const err=e=>toast('เกิดข้อผิดพลาด: '+(e.code||e.message),'err');
function modal(h){const m=document.createElement('div');m.className='fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4';m.innerHTML=`<div class="bg-white rounded-3xl p-6 w-full max-w-md max-h-[90vh] overflow-auto">${h}</div>`;document.body.append(m);m.close=()=>m.remove();return m}
const ask=q=>new Promise(r=>{const m=modal(`<p class="mb-5 font-medium">${q}</p><div class="flex gap-2 justify-end"><button class="g" id="n">ยกเลิก</button><button class="b" id="y">ยืนยัน</button></div>`);m.querySelector('#n').onclick=()=>{m.close();r(false)};m.querySelector('#y').onclick=()=>{m.close();r(true)}});
const qr=(el,t,n)=>{if(!el)return;el.innerHTML='';new QRCode(el,{text:t,width:n,height:n,correctLevel:QRCode.CorrectLevel.H})};
const logo=c=>`<div class="inline-flex flex-col items-center ${c}"><svg viewBox="0 0 70 48" class="h-11"><text x="0" y="42" font-size="50" font-weight="900" font-style="italic" fill="currentColor">M</text><circle cx="52" cy="18" r="12" fill="none" stroke="currentColor" stroke-width="5"/><path d="M46 18l5 5 8-9" fill="none" stroke="currentColor" stroke-width="4"/><path d="M60 27l6 8" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg><b class="text-2xl font-black italic tracking-wide leading-none">MACHECK</b><span class="text-[9px] italic font-semibold tracking-widest">YOTHIN NUKUL SCHOOL</span></div>`;
const av=(s,n,c)=>s?`<img src="${esc(s)}" referrerpolicy="no-referrer" class="${c} rounded-full object-cover ring-2 ring-purple-300">`:`<div class="${c} rounded-full bg-purple-200 text-purple-800 font-bold flex items-center justify-center ring-2 ring-purple-300 shrink-0">${esc((n||'?').replace(/^(นางสาว|นาย|นาง|ครู|คุณครู)/,'')[0]||'?')}</div>`;
const crest=()=>ST.logo?`<img src="${esc(ST.logo)}" class="w-12 h-12 rounded-full object-cover ring-2 ring-purple-300 bg-white">`:`<div class="w-12 h-12 rounded-full bg-gradient-to-br from-[#7c3aed] to-[#3b0764] text-white flex items-center justify-center ring-2 ring-purple-300"><i class="fa-solid fa-graduation-cap"></i></div>`;

// ---------- settings (Studio) ----------
const ST=JSON.parse(localStorage.mc_st||'{}'),saveST=()=>localStorage.mc_st=JSON.stringify(ST);
let Dr={}; // ค่าที่กำลังพิมพ์
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k)Dr[k]=e.target.value});

// ---------- data layer: Cloud (Firestore) / Local (โหมดทดสอบ) ----------
const DEFAULT_CFG={apiKey:"AIzaSyB-96UvU8NsWXNYS4UV_GsFf2Nf3zQJAkQ",authDomain:"macheck1.firebaseapp.com",projectId:"macheck1",appId:"1:197384962959:web:0fbed0435594cdbb7c81fa"};
let fs,auth,cfg=JSON.parse(localStorage.mc_cfg||'null')||DEFAULT_CFG;
const cloud=!!cfg.apiKey&&localStorage.mc_mode!=='demo';
const Cloud={
 sub(n,cb,w){return onSnapshot(w?query(collection(fs,n),where(w[0],'==',w[1])):collection(fs,n),s=>cb(s.docs.map(d=>{const v=d.data(),t=v.ts??v.createdAt;return{id:d.id,...v,ts:t?.toMillis?t.toMillis():t||Date.now()}}).sort((a,b)=>b.ts-a.ts)),e=>toast('โหลดข้อมูลไม่ได้: '+e.code,'err'))},
 async get(n,id){const s=await getDoc(doc(fs,n,id));return s.exists()?{id,...s.data()}:null},
 set(n,id,d,k='ts'){return setDoc(doc(fs,n,id),{...d,[k]:serverTimestamp()})},
 upd(n,id,d){return updateDoc(doc(fs,n,id),d)},
 checkin(id,d){const r=doc(fs,'attendance_logs',id);return runTransaction(fs,async t=>{if((await t.get(r)).exists())return false;t.set(r,{...d,ts:serverTimestamp()});return true})}
};
const store=JSON.parse(localStorage.mc_demo||'{}'),ls=[];
const flush=()=>{localStorage.mc_demo=JSON.stringify(store);ls.forEach(f=>f())};
const Local={
 sub(n,cb,w){const run=()=>{let a=Object.entries(store[n]||{}).map(([id,d])=>({id,...d,ts:d.ts??d.createdAt}));if(w)a=a.filter(x=>x[w[0]]==w[1]);cb(a.sort((x,y)=>y.ts-x.ts))};ls.push(run);run();return()=>ls.splice(ls.indexOf(run),1)},
 async get(n,id){const d=(store[n]||{})[id];return d?{id,...d}:null},
 async set(n,id,d,k='ts'){(store[n]=store[n]||{})[id]={...d,[k]:Date.now()};flush()},
 async upd(n,id,d){Object.assign(store[n][id],d);flush()},
 async checkin(id,d){const l=store.attendance_logs=store.attendance_logs||{};if(l[id])return false;l[id]={...d,ts:Date.now()};flush();return true}
};
let D=Local,me,pending,unsubs=[],S={a:[],s:[],l:[],u:[],ss:[],tab:'home',cur:null};
const unsub=()=>{unsubs.forEach(f=>f());unsubs=[]};
const R=()=>me&&(me.role=='student'?renderS():renderT());

// ---------- actions ----------
const chip=()=>`<button data-a="tm" class="text-xs px-3 py-1.5 rounded-full font-semibold ${cloud?'bg-white/25 text-white':'bg-amber-400 text-black'}">${cloud?'โหมดจริง':'โหมดทดสอบ'}</button>`;
const A={
 nav:b=>{S.tab=b.dataset.t;R()},
 tm:()=>{if(!cfg.apiKey)return fbModal();localStorage.mc_mode=cloud?'demo':'cloud';location.reload()},
 lo:async()=>{if(await ask('ต้องการออกจากระบบหรือไม่?')){if(cloud)await signOut(auth);else landing()}},
 fb:()=>fbModal(),
 pick:b=>{S.cur=b.dataset.id;R()},
 ns:async()=>{const c=(Dr.cls??ST.cls??'').trim()||'ห้องเรียน',s=(Dr.sub??ST.sub??'').trim()||'ไม่ระบุวิชา';ST.cls=c;ST.sub=s;saveST();Dr={};const id=crypto.randomUUID().slice(0,8);
  try{await D.set('attendance_sessions',id,{className:c,subject:s,active:true},'createdAt');S.cur=id;S.tab='home';toast('สร้าง QR Code คาบใหม่แล้ว');R()}catch(e){err(e)}},
 tg:async()=>{const s=cs();if(!s)return;try{await D.upd('attendance_sessions',s.id,{active:!s.active})}catch(e){err(e)}},
 na:async()=>{const t=(Dr.at||'').trim();if(!t)return toast('กรอกชื่องานก่อน','warn');
  try{await D.set('assignments',crypto.randomUUID().slice(0,8),{title:t,due:Dr.ad||''});Dr.at='';Dr.ad='';toast('สั่งงานแล้ว');R()}catch(e){err(e)}},
 sub:async b=>{if(!await ask('ยืนยันส่งงานนี้?'))return;
  try{await D.set('submissions',b.dataset.id+'_'+me.studentId,{assignmentId:b.dataset.id,studentId:me.studentId,uid:me.uid,status:'COMPLETED',score:null});toast('ส่งงานแล้ว')}catch(e){err(e)}},
 sc:()=>scan(),
 ex:()=>navigator.clipboard.writeText(JSON.stringify(me.role=='student'?{profile:me,attendance:S.l,submissions:S.s}:{students:S.u,sessions:S.ss,attendance:S.l,assignments:S.a,submissions:S.s},null,2)).then(()=>toast('คัดลอก JSON แล้ว'),()=>toast('คัดลอกไม่ได้','err')),
 sv:()=>{for(const k of['logo','tname','timg'])if(Dr[k]!==undefined)ST[k]=Dr[k].trim();saveST();Dr={};toast('บันทึกการตั้งค่าแล้ว');R()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b)});
function fbModal(){const m=modal(`<h3 class="font-bold text-lg mb-1"><i class="fa-solid fa-database text-purple-600 mr-2"></i>เชื่อมต่อ Firebase Cloud</h3><p class="text-xs text-slate-500 mb-3">วางค่า firebaseConfig จากโปรเจกต์ของคุณ</p><textarea id="ct" rows="7" class="i font-mono text-xs bg-slate-50" placeholder="{ apiKey: &quot;...&quot;, authDomain: &quot;...&quot;, projectId: &quot;...&quot;, appId: &quot;...&quot; }"></textarea>
<div class="flex flex-wrap gap-2 justify-end"><button id="x" class="g">ปิด</button><button id="cl" class="g">ล้างค่า</button><button id="sv" class="b">เชื่อมต่อทันที</button></div>`);
 m.querySelector('#sv').onclick=()=>{const o={};for(const k of m.querySelector('#ct').value.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g))o[k[1]]=k[2];
  if(!o.apiKey||!o.projectId)return toast('ไม่พบ apiKey / projectId ในค่าที่วาง','err');localStorage.mc_cfg=JSON.stringify(o);localStorage.mc_mode='cloud';location.reload()};
 m.querySelector('#cl').onclick=()=>{localStorage.removeItem('mc_cfg');location.reload()};m.querySelector('#x').onclick=m.close}

// ---------- login ----------
function landing(){unsub();me=null;S.tab='home';
 app.innerHTML=`<div class="min-h-screen bg-gradient-to-b from-[#3b0764] via-[#6d28d9] to-[#c4b5fd] flex flex-col items-center justify-center p-4 relative">
 <div class="absolute top-4 right-4 flex gap-2">${chip()}<button data-a="fb" class="w-9 h-9 rounded-full bg-white/25 text-white"><i class="fa-solid fa-gear"></i></button></div>
 <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-6 text-center"><div class="flex justify-center mb-2">${crest()}</div>${logo('text-[#6d28d9]')}<p class="text-sm text-slate-500 mt-2 mb-4">ระบบเช็กชื่ออัจฉริยะ โรงเรียนโยธินนุกูล</p>
 ${cloud?'':'<div class="text-xs bg-amber-50 text-amber-700 rounded-xl p-3 mb-3">โหมดทดสอบ: ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น กดเฟืองเพื่อเชื่อม Firebase</div>'}
 <div class="flex mb-4 bg-violet-50 rounded-xl p-1"><button id="ts" class="flex-1 py-2 rounded-lg font-semibold">นักเรียน</button><button id="tt" class="flex-1 py-2 rounded-lg font-semibold">ครู / แอดมิน</button></div><div id="pt" class="text-left"></div></div></div>`;
 const pick=r=>{$('#ts').className='flex-1 py-2 rounded-lg font-semibold '+(r=='s'?'bg-[#7c3aed] text-white shadow':'text-slate-500');$('#tt').className='flex-1 py-2 rounded-lg font-semibold '+(r=='t'?'bg-[#7c3aed] text-white shadow':'text-slate-500');
  $('#pt').innerHTML=r=='s'?`<p class="text-xs text-slate-500 mb-2">กรอกข้อมูลครั้งแรกเพื่อผูกบัญชี ครั้งต่อไปกดเข้าสู่ระบบได้เลย</p><input id="sid" inputmode="numeric" class="i" placeholder="รหัสนักเรียน"><input id="gr" class="i" placeholder="ระดับชั้น เช่น ม.6/2"><input id="tr" class="i" placeholder="แผนการเรียน เช่น วิทย์-คณิต"><button id="go" class="b w-full"><i class="fa-brands fa-google mr-2"></i>เข้าสู่ระบบด้วย Google</button>`
   :`<input id="mk" type="password" class="i" placeholder="รหัสลับแอดมิน (Creator Master Key)"><button id="go" class="b w-full"><i class="fa-brands fa-google mr-2"></i>เข้าสู่ระบบครู ด้วย Google</button>`;
  $('#go').onclick=()=>login(r)};
 $('#ts').onclick=()=>pick('s');$('#tt').onclick=()=>pick('t');pick('s')}
async function login(r){
 if(r=='t'){if($('#mk').value!==ADMIN_KEY)return toast('รหัสลับแอดมินไม่ถูกต้อง','err');pending={role:'teacher'}}
 else pending={role:'student',studentId:$('#sid').value.trim(),grade:$('#gr').value.trim(),track:$('#tr').value.trim()};
 if(!cloud)return enter({uid:r+'-'+(pending.studentId||'demo'),displayName:r=='t'?'ครูทดสอบ':'นักเรียนทดสอบ'});
 try{await
